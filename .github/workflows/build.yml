name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5 # v4 se update kiya (Node 24 compatible)

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # v4 se update kiya (Node 24 compatible)
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper (gradlew) is present
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating it..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v6 # v4 se update kiya (Node 24 compatible)
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/*.apk
